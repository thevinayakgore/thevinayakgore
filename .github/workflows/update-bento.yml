name: Update Bento Card

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-bento:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - run: npm install
      
      - name: Set Git user
        run: |
          git config user.name "Vinayak Gore"
          git config user.email "thevinayakgore@gmail.com"
      
      - name: Update Bento Card
        run: npm run update-bento
        env:
          BASE_URL: https://tvg.venumity.com
          GITHUB_ACTIONS: true